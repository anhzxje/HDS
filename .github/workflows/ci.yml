name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore WebApi.Tests/WebApi.Tests.csproj
      - run: dotnet build WebApi.Tests/WebApi.Tests.csproj -c Release --no-restore
      - run: dotnet test WebApi.Tests/WebApi.Tests.csproj -c Release --no-build --logger trx --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: WebApp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: WebApp/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create temporary database password
        shell: bash
        run: |
          password="Aa1!$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          echo "MSSQL_SA_PASSWORD=$password" >> "$GITHUB_ENV"
      - run: docker compose up -d --build
      - name: Check database initialization can run again
        run: docker compose run --rm db-init
      - name: Check API, constraints, document numbers, PDF and Excel through Nginx
        run: python3 scripts/smoke-test.py http://localhost:8080
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=100
      - name: Clean up test containers and volume
        if: always()
        run: docker compose down -v
