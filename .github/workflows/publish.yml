name: Publish images

# Explicit opt-in; this workflow does not deploy or run on PRs/CI completion.
on:
  workflow_dispatch:
    inputs:
      confirm_publish:
        description: 'Authorize publishing this main commit or vX.Y.Z tag to GHCR'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: inputs.confirm_publish == true
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify allowed ref and successful main CI for the exact commit
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_NAME: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RELEASE_REF" != refs/heads/main && ! "$RELEASE_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo 'Only main or a vX.Y.Z version tag may be published.' >&2
            exit 1
          fi
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
          passed=$(gh api "repos/$REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SOURCE_SHA&branch=main&event=push&status=success&per_page=100" --jq '.workflow_runs | length')
          test "$passed" -gt 0 || { echo 'No successful main CI for this exact SHA.' >&2; exit 1; }
          prefix="ghcr.io/${REPOSITORY,,}"
          for component in api web; do
            {
              echo "$component-tags<<TAGS"
              echo "$prefix-$component:sha-$SOURCE_SHA"
              if [[ "$RELEASE_REF" == refs/tags/* ]]; then
                echo "$prefix-$component:$RELEASE_NAME"
              fi
              echo TAGS
            } >> "$GITHUB_OUTPUT"
          done
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: WebApi/Dockerfile
          push: true
          tags: ${{ steps.release.outputs.api-tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=hds-api
          cache-to: type=gha,scope=hds-api,mode=max
      - name: Publish web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: WebApp/Dockerfile
          push: true
          tags: ${{ steps.release.outputs.web-tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=hds-web
          cache-to: type=gha,scope=hds-web,mode=max
